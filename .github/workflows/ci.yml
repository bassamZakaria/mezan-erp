name: CI

on:
  push:
    branches: [main]
  pull_request:

# Skip downloading the Electron binary everywhere in CI — Phase 0 only
# typechecks/lints/tests the desktop stub; it never launches Electron.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  build:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc)
        run: pnpm typecheck

      - name: Lint (layer boundaries + RTL logical properties)
        run: pnpm lint

      - name: Test (vitest, SQLite)
        run: pnpm test

      - name: Build (packages + web Vite bundle)
        run: pnpm build

