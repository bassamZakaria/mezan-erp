name: CI

on:
  push:
    branches: [main]
  pull_request:

# Skip downloading the Electron binary everywhere in CI — Phase 0 only
# typechecks/lints/tests the desktop stub; it never launches Electron.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  build:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc)
        run: pnpm typecheck

      - name: Lint (layer boundaries + RTL logical properties)
        run: pnpm lint

      - name: Build (packages + web Vite bundle)
        run: pnpm build

  # The gate that actually holds the security fixes down. `pnpm build` cannot
  # see an authorization hole — the code compiles either way — so the suite that
  # drives a seeded backend has to run here too, or `scripts/scenarios/security.ts`
  # only ever runs on the machine of whoever remembers it.
  scenarios:
    name: smoke · seed coverage · scenarios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Smoke (boot, seed, every read surface)
        run: pnpm smoke

      - name: Seed coverage (no list surface is empty)
        run: pnpm check:seed

      - name: Scenarios (books, and the authorization boundary)
        run: pnpm scenarios

  # Optional, non-blocking: Playwright E2E against the web build (apps/web).
  # Kept as its own job (not a step in `build`, and not `needs: build`) so a
  # flaky/slow browser install or a real UI regression here never fails the
  # required typecheck/lint/test/build gate above. Run locally with
  # `pnpm test:e2e` (see playwright.config.ts / e2e/).
  e2e:
    name: e2e (Playwright, web)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Playwright E2E
        run: echo "E2E running is disabled (see docs/TESTING.md §1)."

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # The gate that would have caught the Electron 33 → 39 bump.
  #
  # `better-sqlite3` is native and is declared esbuild-`external`, so its `.node`
  # binary has to match the runtime's NODE_MODULE_VERSION: Node 22 is ABI 131,
  # Electron 39 is ABI 140. Nothing above can see the difference — typecheck,
  # lint, test and build all pass on a desktop build that throws at the
  # `new Database(dbPath)` in main/index.ts, which runs BEFORE the pre-migration
  # backup, so the app fails to start AND takes no backup on the way down. The
  # repo crossed that ABI boundary with no `electron-rebuild`, no `npmRebuild`,
  # no postinstall, and — as apps/desktop/scripts/build.mjs says itself — no CI
  # step that ever launched Electron.
  #
  # The ABI steps BLOCK. Packaging does not: electron-builder pulls installers
  # and toolchains over the network and its Linux targets are the flakiest part
  # of this repo's CI surface, so a bad afternoon at a mirror must not close the
  # pipeline — but a native module that genuinely cannot load must.
  desktop:
    name: desktop · native ABI · package
    runs-on: ubuntu-latest
    # NO `ELECTRON_SKIP_BINARY_DOWNLOAD: "0"` HERE, and that is the fix.
    #
    # This job used to override the workflow-level skip with the string "0",
    # which does not override anything: electron/install.js guards on
    # `if (process.env.ELECTRON_SKIP_BINARY_DOWNLOAD)` — a plain truthiness
    # check — and the STRING "0" is truthy in JavaScript. So the download was
    # skipped exactly as if the value were "1", install.js exited 0, and the
    # step went green with no binary on disk. The failure surfaced two steps
    # later as "Electron failed to install correctly, please delete
    # node_modules/electron and try installing again", which sends you to look
    # at the install rather than at the variable that suppressed it.
    #
    # This job had been red on `main` since 2026-08-30 for that reason alone.
    # The variable is now removed from the one step that must not see it (see
    # "Fetch the Electron binary" below) rather than reassigned here.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm-workspace.yaml sets `allowBuilds.electron: false`, which blocks
      # electron's own postinstall for every other job — correct there, since
      # none of them launch it, and the download is ~100MB. Running the
      # package's documented install script here fetches the binary for this job
      # only, without editing the workspace policy every other job depends on.
      # `env -u`, because the value has to be ABSENT, not falsy-looking. See the
      # note on this job's missing `env:` block for what "0" actually did.
      - name: Fetch the Electron binary
        run: env -u ELECTRON_SKIP_BINARY_DOWNLOAD pnpm --filter desktop exec node ./node_modules/electron/install.js

      # The step above is the only one that can silently no-op, so prove it did
      # not: without this, a future change to that guard is invisible again
      # until the ABI check fails with a message about node_modules.
      - name: The Electron binary is actually on disk
        run: |
          test -s apps/desktop/node_modules/electron/path.txt \
            || { echo "::error::electron/path.txt is missing — the binary download was skipped."; exit 1; }
          echo "electron binary: $(cat apps/desktop/node_modules/electron/path.txt)"

      - name: Rebuild native modules against Electron's ABI
        run: |
          ELECTRON_VERSION=$(node -p "require('./apps/desktop/node_modules/electron/package.json').version")
          echo "Rebuilding apps/desktop's native modules for Electron ${ELECTRON_VERSION} (ABI $(cat apps/desktop/node_modules/electron/abi_version))"
          # Not added to package.json: a devDependency here would need a
          # pnpm-lock.yaml change, and this tool is wanted in exactly one CI job.
          npx --yes --package @electron/rebuild -- electron-rebuild -v "${ELECTRON_VERSION}" -m apps/desktop -f

      # THE GATE. Launches the real Electron binary, loads the real
      # better-sqlite3, opens a database and round-trips an Arabic row through
      # it. An ABI mismatch fails here with the NODE_MODULE_VERSION numbers in
      # the log, instead of on a customer's machine on a Friday morning.
      # `--no-sandbox`, and it has to come BEFORE the script path so Chromium
      # parses it at process start rather than treating it as an app argument.
      #
      # A GitHub runner ships Electron's SUID sandbox helper without the
      # root-owned mode 4755 it requires, and Electron aborts rather than run
      # unsandboxed: "The SUID sandbox helper binary was found, but is not
      # configured correctly." This probe opens a SQLite database and renders no
      # web content at all — there is nothing here for that sandbox to contain —
      # so it is disabled for the probe on CI only, and never in the shipped app.
      - name: Native ABI check (Electron opens a database)
        run: xvfb-run -a pnpm --filter desktop exec electron --no-sandbox scripts/check-native-abi.cjs

      - name: Build the main/preload bundles
        run: pnpm --filter desktop run build:main

      # BLOCKS, and it is two seconds. The release gate
      # (apps/desktop/scripts/check-signed.mjs) runs on exactly two occasions —
      # a macOS runner and a Windows runner, both only on a `v*` tag — so a
      # syntax error in it would sit undetected until the one moment it is
      # supposed to be the thing standing between an unsigned build and a
      # customer. Parsing it on every PR costs nothing and removes that window.
      # It cannot be EXECUTED here: on Linux it correctly refuses, because
      # AppImage and .deb carry no signature it could verify.
      - name: The release signing gate still parses
        run: node --check apps/desktop/scripts/check-signed.mjs

      # From here down, failures are reported and not fatal — see the note above.
      - name: Build the web bundle (electron-builder copies it as extraResources)
        continue-on-error: true
        run: pnpm --filter web build

      - name: Package the Linux app
        continue-on-error: true
        run: pnpm --filter desktop exec electron-builder --linux --publish never

      - name: Upload the packaged app
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: apps/desktop/release/*.AppImage
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Signing, notarization and the update feed are NO LONGER MISSING from this
  # repository — they moved to .github/workflows/release.yml, which runs on a
  # `v*` tag, refuses to start without the certificates, and refuses to publish
  # an artifact the operating system will not vouch for. They are not in THIS
  # workflow on purpose: every job here runs on ubuntu with no credentials, and
  # a signing step that no-ops on a PR is the kind of green check that teaches
  # people the gate is working when it is not.
  #
  # What a maintainer still has to do once, by hand, before a release can
  # succeed: create the seven secrets and one variable listed in
  # docs/INSTALL.md §8. Until then `release.yml`'s preflight job fails and
  # produces nothing, which is the intended state — not a bug to work around.
  #
  # Still missing, and deliberately so — a later, dedicated issue owns it:
  #   - Playwright Electron E2E driving the real window on win/macOS/linux
  # See docs/archive/plan.md §2.7 (CI section).
  # ---------------------------------------------------------------------------
