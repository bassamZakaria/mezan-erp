name: CI

on:
  push:
    branches: [main]
  pull_request:

# Skip downloading the Electron binary everywhere in CI — Phase 0 only
# typechecks/lints/tests the desktop stub; it never launches Electron.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  build:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc)
        run: pnpm typecheck

      - name: Lint (layer boundaries + RTL logical properties)
        run: pnpm lint

      - name: Test (vitest, SQLite)
        run: pnpm test

      - name: Build (packages + web Vite bundle)
        run: pnpm build

  # Optional, non-blocking: Playwright E2E against the web build (apps/web).
  # Kept as its own job (not a step in `build`, and not `needs: build`) so a
  # flaky/slow browser install or a real UI regression here never fails the
  # required typecheck/lint/test/build gate above. Run locally with
  # `pnpm test:e2e` (see playwright.config.ts / e2e/).
  e2e:
    name: e2e (Playwright, web)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium only)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

