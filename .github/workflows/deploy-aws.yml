name: Deploy AWS

# AWS is not the current production target (deploy/contabo is; its image is
# built by release-image.yml on the same `production` push). This workflow
# runs only when something is merged into `production`, and fails at its
# first step when the stack's variables are unset. Everything else — typecheck, lint, the unit suite,
# the scenarios — runs locally in the git hooks (.githooks/pre-commit and
# pre-push), so a merge to `main` costs no Actions minutes at all.
#
# It used to run on every push to `main`, which built an ARM64 image under
# QEMU emulation on every merge. Deploying is now a deliberate act: merge
# `main` into `production` to ship. `workflow_dispatch` stays so a failed
# deploy can be retried without a new merge.
#
# The dispatch payload's `environment` is the name cyag-devops knows the stack
# by (`envs/<environment>.tfvars` there): `demo` on a push, or the stack chosen
# on a manual run. Each stack has its own ECR repository, web bucket,
# distribution and app-ci role; a review run reads the REVIEW_* names and never
# falls back to the demo's.
on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      environment:
        description: Stack to deploy — demo, or review (the store reviewers' environment, docs/DEPLOY-REVIEW.md).
        type: choice
        options: [demo, review]
        default: demo

concurrency:
  group: deploy-${{ inputs.environment || 'demo' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  STACK: ${{ inputs.environment || 'demo' }}
  ECR_REPOSITORY_URL: ${{ inputs.environment == 'review' && vars.REVIEW_ECR_REPOSITORY_URL || inputs.environment != 'review' && vars.ECR_REPOSITORY_URL || '' }}
  WEB_BUCKET: ${{ inputs.environment == 'review' && vars.REVIEW_WEB_BUCKET || inputs.environment != 'review' && vars.WEB_BUCKET || '' }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ inputs.environment == 'review' && vars.REVIEW_CLOUDFRONT_DISTRIBUTION_ID || inputs.environment != 'review' && vars.CLOUDFRONT_DISTRIBUTION_ID || '' }}

jobs:
  deploy:
    name: build · push · web · dispatch
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the stack's variables
        run: |
          for name in ECR_REPOSITORY_URL WEB_BUCKET CLOUDFRONT_DISTRIBUTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not set for the ${STACK} stack (docs/DEPLOY-AWS.md, docs/DEPLOY-REVIEW.md)."
              exit 1
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.environment == 'review' && secrets.AWS_REVIEW_APP_CI_ROLE_ARN || inputs.environment != 'review' && secrets.AWS_APP_CI_ROLE_ARN || '' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_REPOSITORY_URL }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Build the web client
        run: pnpm --filter web build

      - name: Sync the web client
        run: aws s3 sync apps/web/dist "s3://${WEB_BUCKET}" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"

      - name: Dispatch the infrastructure deploy
        run: |
          curl -fsS -X POST https://api.github.com/repos/bassamZakaria/cyag-devops/dispatches \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DEVOPS_DISPATCH_TOKEN }}" \
            -d '{"event_type":"mezan-deploy","client_payload":{"image_tag":"${{ github.sha }}","environment":"'"${STACK}"'"}}'
