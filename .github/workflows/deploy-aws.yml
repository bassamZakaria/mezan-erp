name: Deploy AWS

# The ONLY workflow in this repository, and it runs only when something is
# merged into `production`. Everything else — typecheck, lint, the unit suite,
# the scenarios — runs locally in the git hooks (.githooks/pre-commit and
# pre-push), so a merge to `main` costs no Actions minutes at all.
#
# It used to run on every push to `main`, which built an ARM64 image under
# QEMU emulation on every merge. Deploying is now a deliberate act: merge
# `main` into `production` to ship. `workflow_dispatch` stays so a failed
# deploy can be retried without a new merge.
#
# Note the dispatch payload below still says `"environment":"demo"` — that is
# the name the cyag-devops repository knows this stack by, not a statement
# about which branch triggered it. Renaming it here without renaming it there
# would deploy nothing.
on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  deploy:
    name: build · push · web · dispatch
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APP_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Build the web client
        run: pnpm --filter web build

      - name: Sync the web client
        run: aws s3 sync apps/web/dist "s3://${{ vars.WEB_BUCKET }}" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

      - name: Dispatch the infrastructure deploy
        run: |
          curl -fsS -X POST https://api.github.com/repos/bassamZakaria/cyag-devops/dispatches \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DEVOPS_DISPATCH_TOKEN }}" \
            -d '{"event_type":"mezan-deploy","client_payload":{"image_tag":"${{ github.sha }}","environment":"demo"}}'
