name: Deploy AWS

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "apps/**"
      - "packages/**"
      - ".github/workflows/deploy-aws.yml"

concurrency:
  group: deploy-aws
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  TF_VAR_platform_owner_password: ${{ secrets.MEZAN_PLATFORM_OWNER_PASSWORD }}

jobs:
  deploy:
    name: image · terraform · web
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra/terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.AWS_TF_STATE_BUCKET }}" \
            -backend-config="key=mezan/demo.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${{ secrets.AWS_TF_LOCK_TABLE }}"

      - name: Read the registry URL
        id: registry
        working-directory: infra/terraform
        run: echo "url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"

      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${REGISTRY%%/*}"
        env:
          REGISTRY: ${{ steps.registry.outputs.url }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.registry.outputs.url }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Terraform apply
        working-directory: infra/terraform
        run: |
          terraform apply -input=false -auto-approve \
            -var-file=envs/demo.tfvars \
            -var "image_tag=${{ github.sha }}"

      - name: Read the web targets
        id: targets
        working-directory: infra/terraform
        run: |
          echo "bucket=$(terraform output -raw web_bucket)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Build the web client
        run: pnpm --filter web build

      - name: Sync the web client
        run: aws s3 sync apps/web/dist "s3://${{ steps.targets.outputs.bucket }}" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.targets.outputs.distribution }}" \
            --paths "/*"
