name: Release image

# Builds the linux/amd64 image for the Contabo VPS (deploy/contabo) and pushes
# it to GHCR tagged with the commit SHA. The VPS never builds; it pulls the tag
# and, for `staging`, deploys it over SSH (deploy/contabo/ci-deploy.sh). Runs on a push to `staging` or `production`, or by hand.
on:
  push:
    branches: [staging, production]
  workflow_dispatch:

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: tests
    uses: ./.github/workflows/test.yml

  image:
    name: build · push (amd64)
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            MEZAN_VERSION=${{ github.sha }}
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release-amd64
          cache-to: type=gha,mode=max,scope=release-amd64

      - name: Tag to deploy
        env:
          TAG: ${{ github.sha }}@${{ steps.build.outputs.digest }}
        run: echo "::notice::On the VPS run sudo /opt/mezan/deploy.sh $TAG"

  deploy:
    name: deploy · contabo
    # Nothing reaches the VPS unless the tests passed on this commit.
    needs: [test, image]
    # The contabo environment holds the DEPLOY_* secrets and admits only the staging branch.
    if: github.ref == 'refs/heads/staging'
    environment: contabo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: read
    concurrency:
      group: deploy-contabo
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.sha }}@${{ needs.image.outputs.digest }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "deploy@$DEPLOY_HOST" "$TAG"
