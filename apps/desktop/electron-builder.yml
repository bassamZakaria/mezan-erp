# electron-builder config — CONFIG ONLY for Phase 0 (see PR description).
#
# What's wired: package identity, win/mac/linux targets, the `web` bundle
# copied in as extraResources (see main/env.ts `rendererEntry()`), and an
# electron-updater `publish` feed shape (see main/updater.ts).
#
# What's deliberately NOT wired yet — left as documented TODOs, because wiring
# them needs real certificates/Apple credentials, which is exactly the kind of
# secret Phase 0 must not invent:
#   - Code signing (win: `certificateFile`/`certificatePassword` or a signing
#     service; mac: `identity` + a Developer ID cert).
#   - macOS notarization (`afterSign` hook + `notarize: true`/apple credentials).
#   - A real `publish` provider/URL (currently a placeholder `generic` feed).
#
# ---------------------------------------------------------------------------
# WHY THE OS-LEVEL AUTO-INSTALL STAYS OFF, AND WHAT NOW GUARDS UPDATES.
#
# electron-updater on its own verifies a download against the PUBLISHER the app
# was code-signed with. Nothing below signs anything yet, so there is no OS
# publisher identity to verify against. Left as it first shipped — a launch
# check with `autoInstallOnAppQuit = true` against the placeholder feed — that
# was a one-DNS-record path to running a stranger's code inside the process that
# holds the shop's books, on every install at once, on the next quit, with no
# operator action.
#
# Two independent safeguards now close that, and BOTH hold (main/updater.ts):
#   1. App-level Ed25519 verification (main/update-verify.ts) — a SEPARATE,
#      offline-first trust layer that does NOT need the OS certs above. The
#      release build signs each artifact's SHA-512 with the vendor Ed25519 key
#      and publishes the detached signature next to the installer as
#      `<feed>/<version>.sig`; the app refuses to download or install any release
#      whose signature does not verify against `MEZAN_UPDATE_PUBLIC_KEY` (no key
#      configured → nothing is ever installed).
#   2. User consent — autoDownload/autoInstallOnAppQuit are always false; the
#      user chooses download, then install. The launch-time check itself stays
#      off unless `MEZAN_AUTO_UPDATE=1`, and even then waits for closing time.
#
# The release pipeline must therefore, per version:
#   1. build + upload the installer and `latest.yml` (electron-builder),
#   2. sign `latest.yml`'s primary `sha512` with the vendor Ed25519 secret key,
#   3. upload that signature as `<publish.url>/<version>.sig`.
# Set `MEZAN_UPDATE_PUBLIC_KEY` and `MEZAN_UPDATE_FEED_URL` in the build env.
# OS code-signing / notarization (the certs above) is still required for a
# production release and owned by a dedicated release issue — do not ship
# unsigned binaries to customers even though the Ed25519 layer is in place.
# ---------------------------------------------------------------------------
appId: com.mezan.desktop
productName: Mezan
directories:
  output: release
  buildResources: build

# Explicit, not left to the default, because this is the setting that decides
# whether the shipped app can open its own database. `better-sqlite3` is native
# and scripts/build.mjs declares it `external`, so the packaged app loads a
# `.node` binary that must match Electron's NODE_MODULE_VERSION (Electron 39 is
# ABI 140; the Node 22 that runs the tests is 131). Without a rebuild, the
# `new Database(dbPath)` in main/index.ts throws before the pre-migration backup
# runs — the app does not start, and takes no backup on the way down. The repo
# went 33 → 39 with nothing rebuilding it and no CI job that launched Electron;
# .github/workflows/ci.yml's `desktop` job is the gate that now proves it.
npmRebuild: true
files:
  - dist/main/**
  - dist/preload/**
  - package.json
extraResources:
  - from: ../web/dist
    to: web
    filter: ["**/*"]

# TODO(signing): win.certificateFile / win.certificatePassword (or CSC_LINK /
# CSC_KEY_PASSWORD env vars) once a code-signing certificate exists.
win:
  target:
    - target: nsis
      arch: [x64]

# TODO(signing+notarize): mac.identity + notarize config once an Apple
# Developer ID and notarization credentials exist.
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.finance
  hardenedRuntime: true

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office

# PLACEHOLDER FEED. `updates.mezan.example` is a reserved documentation domain
# that resolves to nothing — deliberately, so a build that reached a customer
# with the updater switched on could not find anything to install. Swap it for
# the real distribution channel (S3 / GitHub Releases / self-hosted) only
# together with the signing config above, never before it.
publish:
  provider: generic
  url: https://updates.mezan.example/desktop/
  channel: latest
