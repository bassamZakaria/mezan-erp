name: mezan

services:
  mezan:
    image: ${MEZAN_IMAGE:-ghcr.io/bassamzakaria/mezan-erp}:${MEZAN_IMAGE_TAG:?set MEZAN_IMAGE_TAG in /opt/mezan/.env (deploy.sh writes it)}
    platform: linux/amd64
    container_name: mezan
    restart: unless-stopped
    # SECURITY: never publish this port. A Docker-published port bypasses ufw,
    # and a caller reaching the app directly writes its own X-Forwarded-For and
    # dodges every per-address throttle. Only Caddy, on this network, reaches it.
    expose:
      - "8080"
    env_file:
      - ${MEZAN_ENV_FILE:-/srv/mezan/env}
      - ${MEZAN_SHARED_ENV_FILE:-/srv/mezan/shared.env}
    environment:
      MEZAN_PLATFORM_DIR: /data
      PORT: "8080"
      MEZAN_TRUST_PROXY: "1"
      MEZAN_TRUSTED_PROXY_HOPS: "1"
      MEZAN_SQLITE_EXCLUSIVE: "1"
    volumes:
      - ${MEZAN_DATA_DIR:-/srv/mezan/data}:/data
    user: node
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - edge

  caddy:
    image: caddy:2
    container_name: mezan-caddy
    restart: unless-stopped
    depends_on:
      - mezan
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file:
      - ${MEZAN_SHARED_ENV_FILE:-/srv/mezan/shared.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy.d:/etc/caddy/conf.d:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - edge

networks:
  edge:
    # Without IPv6 on this network, Docker hands IPv6 clients to Caddy through
    # its userland proxy and every one of them arrives from the same gateway
    # address (README "Docker daemon").
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
        - subnet: fd4d:657a:616e::/64

volumes:
  caddy-data:
  caddy-config:
