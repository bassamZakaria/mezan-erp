name: mezan

services:
  mezan:
    image: ${MEZAN_IMAGE:-ghcr.io/bassamzakaria/mezan-erp}:${MEZAN_IMAGE_TAG:?set MEZAN_IMAGE_TAG in /opt/mezan/.env (deploy.sh writes it)}
    platform: linux/amd64
    container_name: mezan
    restart: unless-stopped
    # SECURITY: never publish this port. A Docker-published port bypasses ufw,
    # and a caller reaching the app directly writes its own X-Forwarded-For and
    # dodges every per-address throttle. Only Caddy, on this network, reaches it.
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${MEZAN_ENV_FILE:-/srv/mezan/env}
      - ${MEZAN_SHARED_ENV_FILE:-/srv/mezan/shared.env}
    environment:
      MEZAN_PLATFORM_DIR: /data
      PORT: "8080"
      MEZAN_TRUST_PROXY: "1"
      MEZAN_TRUSTED_PROXY_HOPS: "1"
    volumes:
      - ${MEZAN_DATA_DIR:-/srv/mezan/data}:/data
    user: node
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - edge
      - db

  postgres:
    image: postgres:17.6
    container_name: mezan-postgres
    restart: unless-stopped
    # SECURITY: never publish this port. Only the app, on the internal db
    # network, reaches it.
    expose:
      - "5432"
    # Only the superuser's POSTGRES_* settings; the app's login and secrets are in /srv/mezan/env.
    env_file:
      - ${MEZAN_PG_ENV_FILE:-/srv/mezan/pg.env}
    environment:
      # REQUIRED: C collation and ctype. Every store sorts and case-folds text the
      # way SQLite does only under C; the app refuses to provision otherwise.
      # Applies only when /srv/mezan/pg/data is empty (README "Cutover to Postgres").
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8 --data-checksums"
    command:
      - postgres
      - -c
      # Budget: 3 per open tenant + 5 platform + 2 admin, so about 60 tenants open
      # at once; idle pools give their connections back.
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      # Restore with: restore_command = 'gunzip -c /wal-archive/%f.gz > %p'
      - archive_command=test ! -f /wal-archive/%f.gz && gzip -c %p > /wal-archive/%f.gz.tmp && mv /wal-archive/%f.gz.tmp /wal-archive/%f.gz
      - -c
      - archive_timeout=300
      - -c
      - password_encryption=scram-sha-256
      - -c
      - idle_in_transaction_session_timeout=60s
      - -c
      - log_lock_waits=on
      - -c
      - log_min_duration_statement=2000
    volumes:
      - ${MEZAN_PG_DATA_DIR:-/srv/mezan/pg/data}:/var/lib/postgresql/data
      - ${MEZAN_PG_WAL_ARCHIVE_DIR:-/srv/mezan/data/backups/pg-wal}:/wal-archive
      # Runs once, on an empty data directory; deploy.sh re-runs it on every deploy.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    shm_size: 256m
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d mezan"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - db

  caddy:
    image: caddy:2
    container_name: mezan-caddy
    restart: unless-stopped
    depends_on:
      - mezan
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file:
      - ${MEZAN_SHARED_ENV_FILE:-/srv/mezan/shared.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy.d:/etc/caddy/conf.d:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - edge

networks:
  edge:
    # Without IPv6 on this network, Docker hands IPv6 clients to Caddy through
    # its userland proxy and every one of them arrives from the same gateway
    # address (README "Docker daemon").
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
        - subnet: fd4d:657a:616e::/64
  db:
    internal: true

volumes:
  caddy-data:
  caddy-config:
