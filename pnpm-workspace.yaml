packages:
  - packages/*
  - apps/*
# apps/mobile runs on React 19 and every other workspace on React 18. pnpm's hidden
# hoist store keeps ONE copy per name, so hoisting @types/react put 19 where the web
# client's `react/jsx-runtime` resolves its types from — every JSX element in apps/web
# then failed to typecheck. Keep these two unhoisted so each package reads its own.
# This MUST live here, not in .npmrc: pnpm 11 reads only auth and registry settings
# from .npmrc, so the same lines there were silently ignored (D340).
hoistPattern:
  - "*"
  - "!@types/react"
  - "!@types/react-dom"
  # jest-expo (apps/mobile) brings @types/jsdom. Hoisted, vitest's optional types
  # resolve it and pull lib.dom into every Node-only program that imports vitest:
  # `fetch`'s body type becomes the DOM's and apps/desktop stops typechecking.
  - "!@types/jsdom"
allowBuilds:
  better-sqlite3: true
  esbuild: true
  # electron: the binary download is skipped for every job EXCEPT the `desktop`
  # job in .github/workflows/ci.yml, which overrides
  # ELECTRON_SKIP_BINARY_DOWNLOAD and fetches it explicitly so the native-ABI
  # probe can launch the real runtime. (This comment used to say Electron is
  # "never launched in Phase 0"; that stopped being true when the ABI gate
  # landed — Electron 33 → 39 crossed a NODE_MODULE_VERSION boundary with
  # nothing in CI that would have noticed.)
  electron: false
  # electron-winstaller: only needed by `electron-builder`'s Windows target at
  # package time (apps/desktop/electron-builder.yml), which CI never runs —
  # packaging/signing is deferred (see PR description). Skip its build script.
  electron-winstaller: false
  # The SQLCipher-capable fork of better-sqlite3, used ONLY by the desktop
  # edition to open the tenant database with a key (apps/desktop/src/main/
  # encrypted-database.ts). It is a native module like better-sqlite3 itself,
  # so it has to build — and the desktop CI job's ABI probe now covers both.
  better-sqlite3-multiple-ciphers: true
minimumReleaseAgeExclude:
  - react-router@7.18.3
overrides:
  # GHSA — uuid <11.1.1 misses a buffer bounds check when `buf` is supplied.
  # Reached only through exceljs's internal id generation, which passes no
  # buffer, but a transitive advisory nobody can see the reasoning for is a
  # standing question at every release. Pinned rather than argued about.
  uuid@<11.1.1: ^11.1.1
