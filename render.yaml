services:
  - type: web
    name: mezan-demo
    runtime: docker
    plan: free
    region: frankfurt
    # Without these two keys Render tracks whichever branch was selected in the
    # dashboard when the blueprint was first created — which is how a merge to
    # main deployed nothing at all. Naming the branch here keeps the trigger in
    # the repo instead of in someone's browser session.
    #
    # `production`, not `main`: Render watches the repository itself and deploys
    # on push — it does not go through GitHub Actions, so removing the workflows
    # did not stop it. Tracking `main` meant every merge shipped to the public
    # demo. Deploying is now the deliberate act of merging main into production.
    #
    # KEEP THIS IN STEP WITH THE DASHBOARD. A Blueprint sync applies this file to
    # the service, so if the dashboard says `production` and this file says
    # `main`, the next sync quietly flips the demo back to deploying every merge.
    branch: production
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: MEZAN_PLATFORM_DIR
        value: /tmp/platform
      - key: MEZAN_SEED_DEMO
        value: "1"
      # The free plan caps the instance at 512 MB and the seeded process sits
      # around 375 MB; without a heap ceiling V8 grows into the OOM killer.
      - key: NODE_OPTIONS
        value: --max-old-space-size=400
      # REQUIRED, and deliberately without a value: `sync: false` makes the
      # blueprint STOP and ask for one before it will deploy, and cloud.ts
      # refuses to start without it. The demo serves a writable ERP on the open
      # internet — the shared credential is the only thing in front of it.
      # Minimum 12 characters.
      - key: MEZAN_DEMO_PASSWORD
        sync: false
      # The demo tenant's PIN `123456` is set in apps/server/src/demo-tenant.ts,
      # for that tenant only. MEZAN_SEED_ADMIN_PIN is deliberately absent and
      # cloud.ts refuses to start if it is set. Render keeps a variable that was
      # removed from this file, so on the existing service the dashboard copy of
      # MEZAN_SEED_ADMIN_PIN must be deleted by hand (docs/DEPLOY-DEMO.md).
      # MEZAN_PLATFORM_OWNER_EMAIL / _PASSWORD are `sync: false`: the
      # blueprint stops and asks for a value before it will deploy, so the
      # platform owner's login is never committed to the repo.
      - key: MEZAN_PLATFORM_OWNER_EMAIL
        sync: false
      - key: MEZAN_PLATFORM_OWNER_PASSWORD
        sync: false
      # MEZAN_ANALYTICS_TOKEN is left out deliberately, for the same reason a
      # `sync: false` var would stop the blueprint: set it in the dashboard to a
      # Cloudflare Web Analytics site token and the demo page starts reporting
      # visitors; leave it unset and no beacon is served.
